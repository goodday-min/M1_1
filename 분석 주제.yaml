주제 1 | 장기 복리 수익률 비교  
 "S&P500 vs QQQ vs QLD, 20년 투자하면 얼마가 됐을까?"

분석 포인트:
- 2000년 / 2005년 / 2010년 각각 $10,000 투자 시 현재 가치
- 레버리지(QLD=2x) ETF의 장기 복리 효과 검증
- "레버리지가 항상 유리한가?" 에 대한 실증 분석


주제 2 | 위기 구간 낙폭 & 회복력 비교
"닷컴버블·금융위기·코로나, 위기마다 ETF는 어떻게 버텼나?"

분석 포인트:
- 각 위기별 최대 낙폭(MDD) 비교
- 저점 대비 회복까지 걸린 기간
- QLD(레버리지)는 위기 때 얼마나 더 위험한가?

주제 3 | 레버리지 ETF의 변동성 손실 검증
"QLD는 QQQ의 2배 수익을 줬는가? 진실은?"

분석 포인트:
- 레버리지 ETF의 '변동성 끌림(Volatility Decay)' 현상
- 횡보장 vs 상승장 vs 하락장에서 QLD vs QQQ*2 비교
- 장기 보유 시 레버리지 ETF가 손해인 구간 찾기


주제 4 | 투자 시점에 따른 수익률 분산 분석
"언제 사느냐가 얼마나 중요한가?"

분석 포인트:
- 매월 적립식 투자 vs 일시 투자 수익률 비교
- 고점 매수(버블 직전) vs 저점 매수 수익률 차이
- "타이밍보다 기간이 중요하다"는 통념 검증

주제 5 | 금리 사이클과 ETF 수익률 연계
"금리가 오를 때 QQQ와 S&P500은 어떻게 달랐나?"

분석 포인트:
- 금리 인상기 / 인하기 구간별 수익률 비교
- 기술주 중심 QQQ가 금리에 더 민감한 이유
- 2022년 금리 인상기 QQQ -33% vs S&P500 -19% 비교